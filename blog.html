<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog – Greach Impact</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Markdown to HTML Converter Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <style>
        /* ===== BRAND COLORS ===== */
        :root {
            --navy: #0A0A5E;
            --slate: #3A4574;
            --teal: #64C7D4;
            --aqua: #6ED2DC;
            --white: #FFFFFF;
            --bg: #F8FAFC;
            --text: #0F172A;
            --card-bg: #FFFFFF;
            --border: #E2E8F0;
            --shadow: rgba(10, 10, 94, 0.08);
        }

        [data-theme="dark"] {
            --white: #1A1A2E;
            --bg: #0F0F1A;
            --text: #E2E8F0;
            --card-bg: #1A1A2E;
            --border: #2A2A4E;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.8;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* ---------- HEADER ---------- */
        header {
            background: var(--navy);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(10, 10, 94, 0.3);
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            display: flex;
            align-items: center;
            text-decoration: none;
            color: var(--white);
            font-size: 1.6rem;
            font-weight: 800;
        }

        .logo .teal {
            color: var(--teal);
        }

        .logo img {
            height: 45px;
            width: auto;
            margin-right: 10px;
        }

        nav a {
            text-decoration: none;
            color: var(--white);
            font-weight: 600;
            transition: color 0.2s;
            font-size: 0.9rem;
            padding: 5px 10px;
        }

        nav a:hover {
            color: var(--teal);
        }

        .back-btn {
            background: var(--teal);
            color: var(--navy) !important;
            padding: 8px 20px !important;
            border-radius: 50px;
            font-weight: 700;
        }

        .back-btn:hover {
            background: var(--aqua) !important;
            color: var(--navy) !important;
        }

        /* ---------- BLOG CONTENT ---------- */
        .blog-header {
            padding: 60px 0 30px;
            text-align: center;
            background: linear-gradient(135deg, var(--navy) 0%, var(--slate) 100%);
            color: white;
        }

        .blog-header h1 {
            font-size: 2.8rem;
            font-weight: 800;
        }

        .blog-header h1 span {
            color: var(--teal);
        }

        .blog-header p {
            color: #CBD5E1;
            font-size: 1.2rem;
            margin-top: 10px;
        }

        .blog-post {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 40px;
            margin: 40px 0;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px var(--shadow);
        }

        .blog-post h2 {
            font-size: 2rem;
            color: var(--navy);
            margin-bottom: 5px;
        }

        .blog-post .post-meta {
            color: var(--text);
            opacity: 0.6;
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .blog-post .post-meta i {
            margin-right: 5px;
        }

        .blog-post h3 {
            font-size: 1.4rem;
            color: var(--navy);
            margin: 30px 0 10px;
        }

        .blog-post h4 {
            font-size: 1.1rem;
            color: var(--navy);
            margin: 20px 0 10px;
        }

        .blog-post p {
            color: var(--text);
            opacity: 0.85;
            margin-bottom: 16px;
        }

        .blog-post ul, .blog-post ol {
            padding-left: 25px;
            margin-bottom: 16px;
            color: var(--text);
            opacity: 0.85;
        }

        .blog-post ul li, .blog-post ol li {
            margin-bottom: 8px;
        }

        /* Loading and Error states styling */
        .loading-text, .error-text {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            color: var(--slate);
        }

        /* ---------- FOOTER ---------- */
        footer {
            background: var(--navy);
            color: #94A3B8;
            text-align: center;
            padding: 30px 0;
            margin-top: 40px;
        }

        footer a {
            color: var(--teal);
            text-decoration: none;
            font-weight: 600;
        }

        footer .socials {
            margin-top: 10px;
        }

        footer .socials a {
            color: #94A3B8;
            margin: 0 10px;
            font-size: 1.2rem;
        }

        footer .socials a:hover {
            color: var(--teal);
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 768px) {
            .blog-header h1 { font-size: 2rem; }
            .blog-post { padding: 25px; }
            .blog-post h2 { font-size: 1.6rem; }
            .header-flex { flex-direction: column; gap: 10px; }
            nav { display: flex; flex-wrap: wrap; justify-content: center; }
            .blog-post .post-meta { font-size: 0.8rem; gap: 10px; }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header>
        <div class="container header-flex">
            <a href="index.html" class="logo">
                <img src="https://i.ibb.co/GvPZJc1D/Greach-Impact-Logo.jpg" alt="Greach Impact Logo" />
                <span>Greach<span class="teal">Impact</span></span>
            </a>
            <nav>
                <a href="index.html">Home</a>
                <a href="index.html#about">About</a>
                <a href="index.html#services">Services</a>
                <a href="index.html#contact">Contact</a>
                <a href="blog.html">Blog</a>
                <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Site</a>
            </nav>
        </div>
    </header>

    <!-- ===== BLOG HEADER ===== -->
    <section class="blog-header">
        <div class="container">
            <h1>Greach Impact <span>Blog</span></h1>
            <p>Practical tips on Excel, data, agriculture, and community development</p>
        </div>
    </section>

    <!-- ===== DYNAMIC BLOG HOLDER ===== -->
    <div class="container" id="blog-posts-container">
        <div class="loading-text"><i class="fas fa-spinner fa-spin"></i> Loading latest stories...</div>
    </div>

    <!-- ===== FOOTER ===== -->
    <footer>
        <div class="container">
            <p>&copy; 2026 <a href="index.html">Greach Impact</a> — Data. Agriculture. Community. Impact.</p>
            <div class="socials">
                <a href="#"><i class="fab fa-linkedin"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-youtube"></i></a>
            </div>
        </div>
    </footer>

    <!-- ===== DYNAMIC LOAD ENGINE ===== -->
    <script>
        async function fetchBlogPosts() {
            const container = document.getElementById('blog-posts-container');
            
            try {
                // Fetching the files repository inventory map generated by GitHub/Netlify
                const response = await fetch('https://api.github.com/repos/YOUR_GITHUB_USERNAME/greach-impact-website/contents/blog');
                
                if (!response.ok) {
                    throw new Error("Could not find the blog contents path");
                }
                
                const files = await response.json();
                
                // Clear out loading status label text
                container.innerHTML = '';
                
                // Filter down to process markdown articles exclusively
                const markdownFiles = files.filter(file => file.name.endsWith('.md') || file.name.endsWith('.markdown'));

                if(markdownFiles.length === 0) {
                    container.innerHTML = '<div class="error-text">No articles found in the workspace yet.</div>';
                    return;
                }

                // Process every single markdown post found
                for (const file of markdownFiles) {
                    const postDataResponse = await fetch(file.download_url);
                    const rawText = await postDataResponse.text();
                    
                    // Parse Decap Metadata Frontmatter syntax blocks (--- tags ---)
                    const frontmatterRegex = /^---\s*([\s\S]*?)\r?\n---\s*/;
                    const match = rawText.match(frontmatterRegex);
                    
                    let metadata = { title: "Untitled Post", date: "Unknown Date", author: "Emmanuel Iheomamere" };
                    let bodyMarkdown = rawText;
                    
                    if (match) {
                        bodyMarkdown = rawText.replace(frontmatterRegex, '');
                        const lines = match[1].split('\n');
                        lines.forEach(line => {
                            const [key, ...valParts] = line.split(':');
                            if (key && valParts.length) {
                                const val = valParts.join(':').trim().replace(/^["']|["']$/g, '');
                                metadata[key.trim()] = val;
                            }
                        });
                    }

                    // Format beautiful timestamp strings safely
                    let formattedDate = metadata.date;
                    if(metadata.date !== "Unknown Date") {
                        const parsedDate = new Date(metadata.date);
                        formattedDate = parsedDate.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
                    }

                    // Generate complete layout component block card string dynamically
                    const articleElement = document.createElement('article');
                    articleElement.className = 'blog-post';
                    articleElement.innerHTML = `
                        <h2>${metadata.title}</h2>
                        <div class="post-meta">
                            <span><i class="far fa-calendar-alt"></i> ${formattedDate}</span>
                            <span><i class="far fa-user"></i> ${metadata.author}</span>
                        </div>
                        <div class="post-body">
                            ${marked.parse(bodyMarkdown)}
                        </div>
                    `;
                    
                    // Prepend makes sure the newest article shows up first
                    container.insertBefore(articleElement, container.firstChild);
                }
                
            } catch (error) {
                console.error("Error building the timeline context grid:", error);
                container.innerHTML = '<div class="error-text"><i class="fas fa-exclamation-triangle"></i> Dynamic feed currently offline. Please refresh or try again later.</div>';
            }
        }

        document.addEventListener('DOMContentLoaded', fetchBlogPosts);
    </script>
</body>
</html>
