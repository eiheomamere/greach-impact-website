<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Excel Course – Protected Module | Greach Impact</title>
    <link rel="icon" href="https://i.ibb.co/GvPZJc1D/Greach-Impact-Logo.jpg" type="image/jpeg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0A0A5E;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 500px;
            width: 90%;
            padding: 40px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            border: 1px solid rgba(100,199,212,0.3);
            text-align: center;
        }
        
        .logo {
            margin-bottom: 30px;
        }
        
        .logo img {
            height: 50px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
        
        .logo h2 {
            color: #64C7D4;
            font-size: 1.8rem;
        }
        
        .icon {
            font-size: 3rem;
            color: #64C7D4;
            margin-bottom: 20px;
        }
        
        h1 {
            margin-bottom: 10px;
            font-size: 1.5rem;
        }
        
        p {
            color: rgba(255,255,255,0.7);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        
        .password-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .password-form input {
            padding: 16px 20px;
            border-radius: 12px;
            border: 1px solid rgba(100,199,212,0.3);
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 1rem;
            text-align: center;
            letter-spacing: 2px;
        }
        
        .password-form input:focus {
            outline: 2px solid #64C7D4;
            border-color: transparent;
        }
        
        .password-form button {
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: #64C7D4;
            color: #0A0A5E;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .password-form button:hover {
            background: #6ED2DC;
        }
        
        .error {
            color: #ef4444;
            margin-top: 15px;
            font-size: 0.9rem;
            display: none;
        }
        
        .error.show {
            display: block;
        }
        
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        .back-link:hover {
            color: #64C7D4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="https://i.ibb.co/GvPZJc1D/Greach-Impact-Logo.jpg" alt="Greach Impact Logo" />
            <h2>GreachImpact</h2>
        </div>
        
        <div class="icon">
            <i class="fas fa-lock"></i>
        </div>
        
        <h1>Protected Course Module</h1>
        <p>Please enter the access password to view this module content.</p>
        
        <form class="password-form" id="passwordForm">
            <input type="password" id="passwordInput" placeholder="Enter password" autocomplete="off" />
            <button type="submit">Unlock Module <i class="fas fa-arrow-right"></i></button>
            <div class="error" id="errorMessage">Incorrect password. Please try again.</div>
        </form>
        
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>

    <script>
        // ✅ SET YOUR PASSWORD HERE
        const COURSE_PASSWORD = "greach2026";
        
        // Get the target module from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const targetModule = urlParams.get('module') || 'week1';
        
        // Module URLs mapping
        const moduleUrls = {
            'week1': 'week1.html',
            'week2': 'week2.html',
            'week3': 'week3.html',
            'week4': 'week4.html',
            'dashboard': 'dashboard.html'
        };
        
        document.getElementById('passwordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const password = document.getElementById('passwordInput').value;
            const errorEl = document.getElementById('errorMessage');
            
            if (password === COURSE_PASSWORD) {
                // ✅ Correct password - redirect to the module
                const targetUrl = moduleUrls[targetModule] || 'week1.html';
                window.location.href = targetUrl + '?unlocked=true';
            } else {
                // ❌ Wrong password
                errorEl.classList.add('show');
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        });
        
        // Clear error on input
        document.getElementById('passwordInput').addEventListener('input', function() {
            document.getElementById('errorMessage').classList.remove('show');
        });
    </script>
</body>
</html>
